name: Deploy Momonti

# Frontend → Cloudflare Pages (project: momonti)
# API + Durable Object → Workers (service: momonti-worker)
# Triggered on production pushes.

on:
  push:
    branches: [production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build & deploy PWA (Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Build
        env:
          VITE_BUILD_VERSION: ${{ github.sha }}
        run: pnpm run build
      - name: Stamp service worker version
        run: sed -i "s|__BUILD_VERSION__|${GITHUB_SHA::7}|g" dist/sw.js || true
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: momonti
          directory: dist
          branch: production
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  worker:
    name: Deploy API + Durable Object (Workers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Deploy Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
