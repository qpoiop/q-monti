  <body>
    <style>
      html, body { margin: 0; background: #120e26; color: #f4f2ff; }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: radial-gradient(80% 60% at 50% 40%, rgba(242,193,78,0.16), transparent 60%), #120e26;
        font-family: 'Outfit', 'Noto Sans KR', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 44px;
        letter-spacing: -0.02em;
        background-clip: text;
      }
      #splash span {
        background: linear-gradient(135deg, #f2c14e, #f8d98a 50%, #c855f0);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      body.app-ready #splash { display: none; }
    </style>
    <div id="splash"><span>모몬티</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
