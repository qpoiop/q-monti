name = "momonti-worker"
main = "worker/index.ts"
compatibility_date = "2025-01-09"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[d1_databases]]
binding = "DB"
database_name = "momonti"
database_id = "d71cdb94-9356-44f6-88c8-f0b4254abe8a"

[observability]
enabled = true

# For local dev: wrangler dev on :8787, Vite proxies /ws and /api
[dev]
port = 8787
